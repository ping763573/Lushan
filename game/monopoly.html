<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣大富翁</title>
<style>
:root{
  --bg:#0f2a3a; --panel:#173b52; --panel2:#1d4a66; --ink:#f4f8fb; --muted:#9fc0d3;
  --tile:#fbf6e6; --tileink:#2b2b2b; --accent:#ffb703; --good:#4cd07d; --bad:#ff5d5d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 700px at 20% -10%,#1d5a7a 0,var(--bg) 60%) fixed;color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;flex-wrap:wrap}
.top h1{margin:0;font-size:clamp(18px,3vw,26px);letter-spacing:2px}
.top .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:700;background:#2b6485;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.pri{background:linear-gradient(#ffc83d,#ff9f1c);color:#3a2500}
.btn.danger{background:#c0392b}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.app{display:flex;gap:14px;padding:0 14px 18px;align-items:flex-start;justify-content:center}
.boardwrap{flex:0 1 auto}
.board{
  width:min(100%,760px,calc(100vh - 90px)); width:min(calc(100vw - 460px),760px,calc(100vh - 90px));
  min-width:560px; aspect-ratio:1; container-type:inline-size;
  display:grid; grid-template-columns:repeat(11,1fr); grid-template-rows:repeat(11,1fr);
  gap:2px; padding:3px; background:#0a1c27; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.tile{position:relative;background:var(--tile);color:var(--tileink);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;line-height:1.12;font-size:max(6px,1.45cqw);cursor:pointer;transition:box-shadow .2s,filter .2s;padding-top:14%}
.tile:hover{filter:brightness(1.06)}
.tile .bar{position:absolute;left:0;right:0;top:0;height:14%}
.tile .ic{font-size:max(11px,2.9cqw);line-height:1.05}
.tile .nm{font-weight:800;padding:0 1px;word-break:break-all}
.tile .pr{font-size:.9em;opacity:.75}
.tile .own{position:absolute;right:1px;top:15%;font-size:max(8px,1.9cqw)}
.tile.owned{box-shadow:inset 0 0 0 max(2px,.45cqw) var(--own)}
.tile.corner{background:#e9f3d8;padding-top:0;font-size:max(7px,1.6cqw)}
.tile.corner .ic{font-size:max(14px,4cqw)}
.tile.cur{outline:3px solid #fff;outline-offset:-3px;z-index:2}
.tokens{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;pointer-events:none;padding-top:8%}
.token{
  width:clamp(22px,4.4cqw,34px);height:clamp(22px,4.4cqw,34px);margin:-3px;border-radius:50%;background:#fff;
  border:max(2px,.4cqw) solid var(--pc);display:flex;align-items:center;justify-content:center;
  font-size:clamp(13px,2.9cqw,22px);line-height:1;box-shadow:0 3px 5px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.15);position:relative;z-index:3}
.token.active{z-index:5;animation:hop .22s ease-out,bob .7s .22s ease-in-out infinite alternate}
.token.hop{animation:hop .22s ease-out}
@keyframes hop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-70%) scale(1.3)}100%{transform:translateY(0) scale(1.15)}}
@keyframes bob{from{transform:translateY(0) scale(1.15)}to{transform:translateY(-22%) scale(1.3)}}
.center{grid-area:2/2/11/11;background:linear-gradient(160deg,#1c7a5a,#145a45);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;padding:2cqw;text-align:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.center h2{margin:0;font-size:max(14px,4.2cqw);letter-spacing:.4em;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.turn{font-size:max(11px,2.4cqw);font-weight:700;background:rgba(0,0,0,.25);padding:.6cqw 2cqw;border-radius:99px}
.dice{display:flex;gap:2.2cqw}
.die{width:max(40px,9cqw);height:max(40px,9cqw);background:#fff;border-radius:18%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11%;box-shadow:0 4px 0 #bbb,0 8px 14px rgba(0,0,0,.35)}
.die i{display:block;border-radius:50%;margin:14%}
.die i.on{background:#222}
.die.one i.on{background:#d62828}
.die.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(10deg) translateY(-6px)}100%{transform:rotate(-10deg) translateY(0)}}
.roll{font-size:max(13px,2.8cqw);padding:max(8px,1.4cqw) max(18px,4cqw)}
.cmsg{font-size:max(10px,2.1cqw);min-height:2.6em;max-width:90%;opacity:.95}
.side{width:380px;display:flex;flex-direction:column;gap:12px;flex:0 0 380px}
.players{display:grid;gap:10px}
.pcard{background:var(--panel);border-radius:12px;padding:10px 12px;border-left:6px solid var(--pc);transition:transform .2s,box-shadow .2s,opacity .2s}
.pcard.cur{transform:scale(1.02);box-shadow:0 0 0 2px var(--pc),0 8px 18px rgba(0,0,0,.35);background:var(--panel2)}
.pcard.out{opacity:.45;filter:grayscale(.8)}
.ph{display:flex;align-items:center;gap:10px}
.pav{width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid var(--pc);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.pn{font-weight:800}
.pm{margin-left:auto;font-size:20px;font-weight:900;color:var(--good);font-variant-numeric:tabular-nums}
.pm.neg{color:var(--bad)}
.pst{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;min-height:6px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5)}
.tag.dk{color:#222;text-shadow:none}
.logbox{background:var(--panel);border-radius:12px;padding:10px 12px}
.logbox h3{margin:0 0 6px;font-size:14px;color:var(--muted)}
.log{height:170px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:3px}
.log div{padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.05)}
.overlay{position:fixed;inset:0;background:rgba(5,15,22,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.overlay.show{display:flex}
#setup{z-index:60}
.box{background:#fff;color:#222;border-radius:16px;padding:20px 22px;width:min(460px,100%);max-height:92vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.5);animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.box h2{margin:0 0 10px;font-size:22px}
.box .lbl{font-weight:700;margin:12px 0 6px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:10px;border:2px solid #cfd8dc;background:#f5f8fa;font-size:16px;font-weight:700}
.seg button.on{border-color:#ff9f1c;background:#fff1d6}
.mrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.mrow .av{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--pc);display:flex;align-items:center;justify-content:center;font-size:20px}
.mrow input{flex:1;padding:9px 10px;border:2px solid #cfd8dc;border-radius:10px;font-size:16px}
.mrow input:focus{outline:none;border-color:#ff9f1c}
.hint{font-size:12px;color:#777;margin-top:4px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.box .btn{box-shadow:0 3px 0 rgba(0,0,0,.2)}
.dbody{font-size:16px;line-height:1.6}
.dbody .big{font-size:42px;text-align:center}
.dbody b{color:#c0392b}
@media (max-width:900px){
  .app{flex-direction:column;align-items:center;padding:0 8px 18px}
  .board{width:min(100%,760px);min-width:0}
  .boardwrap{width:100%;display:flex;justify-content:center}
  .side{width:100%;flex:1 1 auto;max-width:760px}
  .players{grid-template-columns:1fr 1fr}
  .pcard{padding:8px 9px}.pav{width:34px;height:34px;font-size:20px}.pm{font-size:16px}
}
@media (max-width:420px){ .players{grid-template-columns:1fr} }

/* ===== 3D 強化層 ===== */
.boardwrap{perspective:1500px;padding:6px 0 26px}
.board{transition:transform .6s ease,box-shadow .6s;transform-origin:50% 72%}
.board.tilt{transform:rotateX(26deg) scale(.97);box-shadow:0 34px 40px rgba(0,0,0,.5),0 0 0 6px #0f2f44}
@media (max-width:900px){.board.tilt{transform:rotateX(18deg)}}
.tile{perspective:220px;background:linear-gradient(160deg,#fffdf2,#f1e9cc);
  --th:0 1px 0 #d9d0ae,0 2px 0 #cdc39d,0 3px 0 #bfb48c,0 4px 0 #b1a67e,0 7px 7px rgba(0,0,0,.45);
  box-shadow:var(--th);transition:transform .25s,box-shadow .25s,filter .2s}
.tile.corner{background:linear-gradient(160deg,#f3fbe4,#d7e8bb)}
.tile.owned{box-shadow:inset 0 0 0 max(2px,.45cqw) var(--own),var(--th)}
.tile:hover{transform:translateY(-3px)}
.tile .ic{display:inline-block;transition:transform .55s;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.45)) drop-shadow(0 2px 0 rgba(0,0,0,.3)) drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.tile:hover .ic{transform:translateY(-3px) scale(1.2) rotateY(360deg)}
.tile .own{width:max(12px,2.6cqw);height:max(12px,2.6cqw);border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 25%,#fff,#d9d9d9);box-shadow:0 2px 3px rgba(0,0,0,.45);font-size:max(8px,1.7cqw);top:17%;right:2px}
.tile .own:empty{display:none}
/* 3D 棋子：立體球體 + 落地陰影 + 旋轉 */
.token{background:radial-gradient(circle at 32% 26%,#fff 0,#f6f6f6 38%,#c4c4c4 100%);perspective:90px;
  box-shadow:inset -3px -4px 6px rgba(0,0,0,.28),inset 2px 2px 4px rgba(255,255,255,.9),0 4px 0 color-mix(in srgb,var(--pc) 70%,#000),0 8px 10px rgba(0,0,0,.45)}
.token .em{display:block;transform-style:preserve-3d;text-shadow:0 1px 0 rgba(0,0,0,.25),0 2px 2px rgba(0,0,0,.3)}
.token.active .em{animation:spin3d 2.6s linear infinite}
@keyframes spin3d{to{transform:rotateY(360deg)}}
.token::after{content:'';position:absolute;left:12%;right:12%;bottom:-36%;height:24%;background:rgba(0,0,0,.38);border-radius:50%;filter:blur(2px);z-index:-1}
/* 3D 骰子：真正的立方體 */
.dice{display:flex;gap:3.6cqw;perspective:700px;--ds:max(44px,8.5cqw);padding:1cqw}
.die3{width:var(--ds);height:var(--ds);position:relative}
.die3::after{content:'';position:absolute;left:8%;right:8%;bottom:-14%;height:14%;background:rgba(0,0,0,.4);border-radius:50%;filter:blur(3px)}
.die3.toss{animation:toss .95s ease-out}
@keyframes toss{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-45%) scale(1.25)}65%{transform:translateY(0) scale(1)}78%{transform:translateY(-10%)}100%{transform:translateY(0)}}
.cube{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#dedede);border-radius:16%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:12%;box-shadow:inset 0 0 9px rgba(0,0,0,.28);backface-visibility:hidden}
.face i{display:block;border-radius:50%;margin:16%}
.face i.on{background:radial-gradient(circle at 35% 30%,#666,#0e0e0e);box-shadow:inset 0 -1px 2px rgba(255,255,255,.3)}
.face.one i.on{background:radial-gradient(circle at 35% 30%,#ff7b7b,#a80000)}
.center h2{text-shadow:0 1px 0 #0d4a37,0 2px 0 #0b3f30,0 3px 0 #093526,0 7px 7px rgba(0,0,0,.45)}
.dbody .big{filter:drop-shadow(0 3px 0 rgba(0,0,0,.25)) drop-shadow(0 8px 6px rgba(0,0,0,.25));animation:floaty 2.4s ease-in-out infinite}
.bt{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;text-align:left}
.bt td{padding:5px 6px;border-bottom:1px solid #eee}
.bt td:first-child{color:#666;white-space:nowrap}
.bt td:last-child{text-align:right}
@keyframes floaty{0%,100%{transform:translateY(0) rotateY(-12deg)}50%{transform:translateY(-6px) rotateY(12deg)}}
</style>
</head>
<body>
<div class="top">
  <h1>🎲 台灣大富翁</h1>
  <div class="btns">
    <button class="btn" id="tiltBtn">🎥 3D 視角：開</button>
    <button class="btn" id="soundBtn">🔊 音效：開</button>
    <button class="btn" id="setupBtn">⚙️ 開局設定 / 重置</button>
  </div>
</div>

<div class="app">
  <div class="boardwrap"><div class="board tilt" id="board">
    <div class="center">
      <h2>台灣大富翁</h2>
      <div class="turn" id="turnInfo"></div>
      <div class="dice"><div class="die3"><div class="cube" id="d1"></div></div><div class="die3"><div class="cube" id="d2"></div></div></div>
      <button class="btn pri roll" id="rollBtn">🎲 擲骰子</button>
      <div class="cmsg" id="cmsg"></div>
    </div>
  </div></div>
  <div class="side">
    <div class="players" id="players"></div>
    <div class="logbox"><h3>📜 遊戲紀錄</h3><div class="log" id="log"></div></div>
  </div>
</div>

<div class="overlay" id="dlg"><div class="box"><h2 id="dTitle"></h2><div class="dbody" id="dBody"></div><div class="actions" id="dBtns"></div></div></div>

<div class="overlay show" id="setup"><div class="box">
  <h2>🎲 開局設定</h2>
  <div class="lbl">玩家人數</div>
  <div class="seg" id="cntSeg">
    <button data-n="2" class="on">2 人</button><button data-n="3">3 人</button><button data-n="4">4 人</button>
  </div>
  <div class="lbl">每位玩家起始金額（最低 1,000）</div>
  <div id="moneyRows"></div>
  <div class="hint">經過起點可領 $2,000；資金低於 $0 即破產淘汰，最後存活者獲勝。</div>
  <div class="actions">
    <button class="btn" id="cancelBtn" style="display:none">取消</button>
    <button class="btn pri" id="startBtn">🚀 開始遊戲</button>
  </div>
</div></div>

<script>
(()=>{
'use strict';
/* ========== 資料 ========== */
const GC={brown:'#8d6e63',lb:'#4fc3f7',pink:'#f06292',orange:'#ffa726',red:'#e53935',yellow:'#fdd835',green:'#43a047',blue:'#1e56c8',rail:'#455a64',util:'#7e57c2'};
const P=(n,g,p,ic)=>({n,t:'prop',g,p,ic});
const TILES=[
 {n:'起點',t:'start',ic:'🏁'},P('艋舺夜市','brown',1000,'🍢'),{n:'命運',t:'fate',ic:'🎴'},P('士林夜市','brown',1200,'🥟'),
 {n:'所得稅',t:'tax',a:1500,ic:'🧾'},{n:'高鐵台北站',t:'rail',p:2000,g:'rail',ic:'🚄'},P('九份老街','lb',1400,'🏮'),
 {n:'機會',t:'chance',ic:'❓'},P('淡水老街','lb',1400,'🌅'),P('野柳地質公園','lb',1600,'🪨'),
 {n:'監獄（參觀）',t:'jail',ic:'⛓️'},
 P('墾丁大街','pink',1800,'🏖️'),{n:'台積電',t:'util',p:1500,g:'util',ic:'💾'},P('阿里山','pink',1800,'🌲'),P('日月潭','pink',2000,'🛶'),
 {n:'高鐵台中站',t:'rail',p:2000,g:'rail',ic:'🚄'},P('清境農場','orange',2200,'🐑'),{n:'命運',t:'fate',ic:'🎴'},
 P('逢甲夜市','orange',2200,'🍗'),P('鹿港老街','orange',2400,'🏘️'),
 {n:'免費停車',t:'park',ic:'🅿️'},
 P('太魯閣','red',2600,'⛰️'),{n:'機會',t:'chance',ic:'❓'},P('七星潭','red',2600,'🌊'),P('台東熱氣球','red',2800,'🎈'),
 {n:'高鐵台南站',t:'rail',p:2000,g:'rail',ic:'🚄'},P('赤崁樓','yellow',3000,'🏯'),P('安平古堡','yellow',3000,'🏰'),
 {n:'長榮海運',t:'util',p:1500,g:'util',ic:'🚢'},P('駁二特區','yellow',3200,'🎨'),
 {n:'前往監獄',t:'gojail',ic:'👮'},
 P('高雄85大樓','green',3400,'🏙️'),P('西子灣','green',3400,'🌇'),{n:'命運',t:'fate',ic:'🎴'},P('澎湖花火節','green',3600,'🎆'),
 {n:'高鐵左營站',t:'rail',p:2000,g:'rail',ic:'🚄'},{n:'機會',t:'chance',ic:'❓'},P('台北101','blue',4000,'🏢'),
 {n:'奢侈稅',t:'tax',a:1000,ic:'💎'},P('總統府','blue',5000,'🏛️')
];
/* 每塊地獨立設定過路費：有人是高報酬熱點、有人是低報酬長線，需要自己計算 */
const RENT={1:140,3:90,6:200,8:70,9:160,11:330,13:100,14:240,16:130,18:400,19:190,21:220,23:520,24:170,26:300,27:150,29:640,31:250,32:480,34:800,37:400,39:450};
TILES.forEach((t,i)=>{t.i=i;if(t.t==='prop')t.rent=RENT[i];});
const GROUPS={};TILES.forEach(t=>{if(t.g&&t.t==='prop')(GROUPS[t.g]??=[]).push(t.i);});
const PLAYERS=[{e:'🐶',c:'#e53935',n:'玩家 1'},{e:'🐱',c:'#1e88e5',n:'玩家 2'},{e:'🐰',c:'#43a047',n:'玩家 3'},{e:'🐻',c:'#fb8c00',n:'玩家 4'}];
const SALARY=2000;

const CHANCE=[
 {t:'中了統一發票特獎！獲得 $2,000',f:async(p)=>gain(p,2000)},
 {t:'前進到起點，領取 $2,000',f:async(p,d)=>moveTo(p,0,d)},
 {t:'搭乘高鐵前往「高鐵台中站」',f:async(p,d)=>moveTo(p,15,d)},
 {t:'前往「台北101」跨年看煙火',f:async(p,d)=>moveTo(p,37,d)},
 {t:'騎車闖紅燈，罰款 $500',f:async(p)=>pay(p,500,null,'闖紅燈罰款')},
 {t:'順風推一把，前進 3 格',f:async(p,d)=>moveBy(p,3,d)},
 {t:'走錯路了，後退 3 格',f:async(p,d)=>moveBy(p,-3,d)},
 {t:'被查到逃漏稅，直接前往監獄！',f:async(p)=>goJail(p)},
 {t:'發票對中小獎，獲得 $800',f:async(p)=>gain(p,800)},
 {t:'前往「墾丁大街」度假',f:async(p,d)=>moveTo(p,11,d)},
];
const FATE=[
 {t:'生日快樂！每位對手各送你 $300',f:async(p)=>{for(const o of alive()) if(o!==p){await pay(o,300,p,'生日紅包');}}},
 {t:'繳交健保費 $600',f:async(p)=>pay(p,600,null,'健保費')},
 {t:'股票大賺，獲得 $1,500',f:async(p)=>gain(p,1500)},
 {t:'房屋修繕，每塊地產付 $200',f:async(p)=>{const n=p.props.length;if(!n){msg('你沒有地產，免修繕費');return;}await pay(p,200*n,null,`修繕費（${n}塊地）`);}},
 {t:'領取年終獎金 $1,200',f:async(p)=>gain(p,1200)},
 {t:'颱風天停班，損失 $700',f:async(p)=>pay(p,700,null,'颱風損失')},
 {t:'請大家吃滷肉飯，付給每位對手 $200',f:async(p)=>{for(const o of alive()) if(o!==p&&!p.bankrupt){await pay(p,200,o,'請客');}}},

/* ========== 音效 (Web Audio 合成) ========== */
let AC=null,soundOn=true;
function ensureAudio(){
  try{ if(!AC){const C=window.AudioContext||window.webkitAudioContext; if(C)AC=new C();} if(AC&&AC.state==='suspended')AC.resume(); }catch(e){}
}
function tone(f,dur=.15,type='sine',vol=.18,when=0,slide=null){
  if(!soundOn||!AC)return;
  const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.03);
}
function noise(dur=.05,vol=.12,when=0,hp=1500){
  if(!soundOn||!AC)return;
  const t=AC.currentTime+when,n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start(t);
}
const SFX={
  roll(){for(let i=0;i<9;i++){noise(.05,.16,i*.08,800+Math.random()*1500);tone(180+Math.random()*200,.05,'square',.05,i*.08);}},
  step(k){tone(420+k*38,.09,'triangle',.2);tone(840+k*76,.05,'sine',.06,.01);},
  buy(){tone(1318,.5,'sine',.2);tone(1760,.6,'sine',.16,.09);noise(.04,.1,0,5000);},
  salary(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.2,i*.09));tone(1568,.35,'sine',.12,.38);},
  pay(){tone(330,.3,'sawtooth',.12,0,140);noise(.12,.1,.02,400);},
  tax(){tone(260,.25,'square',.1,0,120);tone(180,.3,'square',.1,.15,90);},
  card(){tone(500,.25,'sine',.15,0,1000);tone(1000,.2,'triangle',.12,.2);tone(1250,.25,'triangle',.1,.32);},
  jail(){for(let i=0;i<6;i++)tone(i%2?620:880,.17,'square',.1,i*.17);},
  bad(){[400,320,250,180].forEach((f,i)=>tone(f,.25,'sawtooth',.12,i*.17));},
  win(){const n=[523,523,523,659,784,659,784,1047];const d=[.14,.14,.14,.2,.3,.2,.2,.7];let t=0;n.forEach((f,i)=>{tone(f,d[i]+.1,'square',.12,t);tone(f/2,d[i]+.1,'triangle',.14,t);t+=d[i]+.04;});},
};
const sfx=(k,...a)=>{ensureAudio();try{SFX[k](...a);}catch(e){}};

/* ========== 棋盤 ========== */
function cellPos(i){
  if(i<=10)return[11,11-i];
  if(i<=20)return[11-(i-10),1];
  if(i<=30)return[1,1+(i-20)];
  return[1+(i-30),11];
}
function buildBoard(){
  const b=$('#board');b.querySelectorAll('.tile').forEach(e=>e.remove());
  TILES.forEach(t=>{
    const e=document.createElement('div');e.className='tile';e.id='tile-'+t.i;
    const [r,c]=cellPos(t.i);e.style.gridRow=r;e.style.gridColumn=c;
    if([0,10,20,30].includes(t.i))e.classList.add('corner');
    const col=t.g?GC[t.g]:(t.t==='chance'?'#ff7043':t.t==='fate'?'#ab47bc':t.t==='tax'?'#78909c':null);
    e.innerHTML=(col?`<i class="bar" style="background:${col}"></i>`:'')+
      `<span class="ic">${t.ic}</span><span class="nm">${t.n}</span>`+(t.p?`<span class="pr">${fmt(t.p)}</span>`:t.a?`<span class="pr">-${fmt(t.a)}</span>`:'')+
      `<span class="own"></span><div class="tokens"></div>`;
    e.onclick=()=>showTileInfo(t.i);
    b.appendChild(e);
  });
}
function renderTokens(){
  document.querySelectorAll('.tokens').forEach(e=>e.innerHTML='');

  players.forEach((p,idx)=>{

function renderOwners(){

function msg(t,logOnly){

function dieHTML(v){
  const on={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[v];

const FACE_ROT={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],2:[-90,0],5:[90,0]};

function ask(title,html,btns=[{t:'確定',v:true,c:'pri'}]){
  const g=gameId;
  return new Promise((res,rej)=>{
    $('#dTitle').textContent=title;$('#dBody').innerHTML=html;const bx=$('#dBtns');bx.innerHTML='';
    pending=()=>rej(RESET);

      e.onclick=()=>{$('#dlg').classList.remove('show');pending=null;g===gameId?res(b.v):rej(RESET);};bx.appendChild(e);});
    $('#dlg').classList.add('show');

}
function showTileInfo(i){
  if(busy&&pending)return;
  const t=TILES[i];let h=`<div class="big">${t.ic}</div>`;
  if(t.p){
    if(owner[i]!=null)h+=`<b>${players[owner[i]].e} ${players[owner[i]].n}</b> 的地產` + benefitHTML(t,players[owner[i]],false);
    else if(started&&players.length)h+=`尚無主，以 ${cur().e} ${cur().n} 買下為例` + benefitHTML(t,cur(),true);

/* ========== 遊戲動作 ========== */
async function walk(p,steps,dir=1){
  for(let k=1;k<=steps;k++){
    p.pos=(p.pos+dir+40)%40;
    if(dir>0&&p.pos===0){p.money+=SALARY;sfx('salary');msg(`${p.e} ${p.n} 經過起點，領取 ${fmt(SALARY)}！`);renderPanel();}
    else sfx('step',k);
    renderTokens();
    await sleep(220);
  }
}
async function moveTo(p,target,d){
  const steps=(target-p.pos+40)%40;
  msg(`${p.e} ${p.n} 前進到「${TILES[target].n}」`);
  await walk(p,steps);
  if(d<3)await land(p,d+1);
}
async function moveBy(p,n,d){
  await walk(p,Math.abs(n),n>0?1:-1);
  if(d<3)await land(p,d+1);
}
function gain(p,n){p.money+=n;sfx('buy');msg(`${p.e} ${p.n} 獲得 ${fmt(n)}`);renderPanel();return sleep(400);}
async function goJail(p){
  sfx('jail');p.pos=10;p.jail=1;renderTokens();renderPanel();
  msg(`🚨 ${p.e} ${p.n} 被送進監獄，暫停一回合！`);
  await sleep(900);
}
async function pay(p,n,to,reason){
  sfx(reason&&reason.includes('稅')?'tax':'pay');
  const before=p.money;p.money-=n;
  if(to)to.money+=Math.min(n,Math.max(0,before));
  msg(`${p.e} ${p.n} 支付 ${fmt(n)}${to?`給 ${to.e} ${to.n}`:''}（${reason}）`);
  renderPanel();await sleep(450);
  await checkBankrupt(p);
}
async function checkBankrupt(p){
  if(p.money>=0||p.bankrupt)return;
  p.bankrupt=true;
  p.props.forEach(i=>owner[i]=null);const n=p.props.length;p.props=[];
  sfx('bad');updateUI();
  msg(`💥 ${p.e} ${p.n} 破產淘汰！${n?`名下 ${n} 塊地產已充公。`:''}`);
  const left=alive();
  if(left.length===1){await ask(`💥 ${p.n} 破產`,`<div class="big">${p.e}💥</div>${p.n} 資金低於 $0，宣告破產淘汰！`);await win(left[0]);return;}
  await ask(`💥 ${p.n} 破產`,`<div class="big">${p.e}💥</div>${p.n} 資金低於 $0，宣告破產淘汰！<br>名下 ${n} 塊地產已充公，恢復無主狀態。`);
}
async function win(p){
  over=true;busy=true;sfx('win');updateUI();
  msg(`🏆 ${p.e} ${p.n} 成為最後的大富翁！`);
  const r=await ask('🏆 遊戲結束',`<div class="big">${p.e}🏆</div><b style="color:#1b7a3d">${p.n}</b> 擊敗所有對手，成為台灣大富翁！<br>最終資產：${fmt(p.money)}，地產 ${p.props.length} 塊。`,
    [{t:'關閉',v:false},{t:'再玩一局',v:true,c:'pri'}]);
  if(r)openSetup(false);
}
/* 地產效益評估：過路費、集滿加成、預估回本 */
function rentAvg(t,o,hyp){
  if(t.t==='prop'){const g=GROUPS[t.g],n=g.filter(i=>owner[i]===o.id).length+(hyp?1:0);return t.rent*(n===g.length?2:1);}
  if(t.t==='rail'){return 250*(TILES.filter(x=>x.t==='rail'&&owner[x.i]===o.id).length+(hyp?1:0));}
  const c=TILES.filter(x=>x.t==='util'&&owner[x.i]===o.id).length+(hyp?1:0);return 7*(c>=2?100:40);
}
function benefitHTML(t,p,hyp=true){
  const opp=Math.max(1,alive().length-1),r=rentAvg(t,p,hyp),lap=r*opp/7,rows=[];
  rows.push(['價格',fmt(t.p)]);
  if(t.t==='prop'){
    const g=GROUPS[t.g],n=g.filter(i=>owner[i]===p.id).length+(hyp?1:0);
    rows.push(['別人到此過路費',`<b>${fmt(r)}</b>`]);
    rows.push([`同色集滿（${n}/${g.length}）`,n===g.length?'✅ 已集滿，過路費 ×2':`集滿後 ${fmt(t.rent*2)}`]);
  }else if(t.t==='rail'){
    const n=TILES.filter(x=>x.t==='rail'&&owner[x.i]===p.id).length+(hyp?1:0);
    rows.push(['別人到此過路費',`<b>${fmt(r)}</b>（${n} 站）`]);
    rows.push(['四站全擁有','每站 $1,000']);
  }else{
    const c=TILES.filter(x=>x.t==='util'&&owner[x.i]===p.id).length+(hyp?1:0);
    rows.push(['別人到此過路費',`<b>約 ${fmt(r)}</b>（骰子點數 × $${c>=2?100:40}）`]);
    rows.push(['兩家企業都擁有','骰子點數 × $100（約 $700）']);
  }
  const pct=r/t.p*100;
  rows.push(['過路費佔地價',`<b>${pct.toFixed(1)}%</b>`]);
  rows.push(['投資評等',pct>=16?'🔥 高報酬・回本快':pct>=9?'⚖️ 中等報酬':'🐢 低報酬・靠集滿翻倍']);
  rows.push(['預估每圈收益',`約 ${fmt(lap)}${opp>1?`（${opp} 位對手）`:''}`]);
  rows.push(['預估回本',`約 ${(t.p/lap).toFixed(1)} 圈`]);
  return `<table class="bt">${rows.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table><div class="hint">預估以每位對手每圈約 1/7 機率踩到此格計算，僅供參考。</div>`;
}
function rentOf(t,o){
  if(t.t==='prop'){
    let r=t.rent;const g=GROUPS[t.g];
    if(g.every(i=>owner[i]===o.id))r*=2;return r;
  }
  if(t.t==='rail'){return 250*TILES.filter(x=>x.t==='rail'&&owner[x.i]===o.id).length;}
  const c=TILES.filter(x=>x.t==='util'&&owner[x.i]===o.id).length;
  return lastRoll*(c>=2?100:40);
}
async function land(p,d=0){
  if(p.bankrupt||over)return;
  const t=TILES[p.pos];
  switch(t.t){
    case 'prop':case 'rail':case 'util':{
      const o=owner[t.i];
      if(o==null){
        if(p.money<t.p){msg(`${p.e} ${p.n} 資金不足，買不起「${t.n}」（${fmt(t.p)}）`);await sleep(600);break;}
        const ok=await ask(`${t.ic} ${t.n}`,`<div class="big">${t.ic}</div>這塊地目前無主！你的資金：<b>${fmt(p.money)}</b>（買後剩 ${fmt(p.money-t.p)}）${benefitHTML(t,p)}`,
          [{t:'不買',v:false},{t:`購買 ${fmt(t.p)}`,v:true,c:'pri'}]);
        if(ok){p.money-=t.p;owner[t.i]=p.id;p.props.push(t.i);sfx('buy');msg(`🏷️ ${p.e} ${p.n} 買下「${t.n}」（${fmt(t.p)}）`);updateUI();await sleep(500);}
        else msg(`${p.e} ${p.n} 選擇不購買「${t.n}」`);
      }else if(o!==p.id){
        const ow=players[o],r=rentOf(t,ow);
        await pay(p,r,ow,`「${t.n}」過路費`);
      }else msg(`${p.e} ${p.n} 來到自己的地產「${t.n}」`);
      break;}
    case 'tax':await pay(p,t.a,null,t.n);break;
    case 'chance':case 'fate':{
      sfx('card');const deck=t.t==='chance'?CHANCE:FATE,c=deck[Math.floor(Math.random()*deck.length)];
      msg(`${p.e} ${p.n} 抽到${t.n}卡：${c.t}`);
      await ask(t.t==='chance'?'❓ 機會':'🎴 命運',`<div class="big">${t.t==='chance'?'❓':'🎴'}</div>${c.t}`);
      await c.f(p,d);break;}
    case 'gojail':await goJail(p);break;
    case 'park':msg(`${p.e} ${p.n} 在免費停車場休息一下 ☕`);await sleep(500);break;
    case 'jail':msg(`${p.e} ${p.n} 只是來監獄參觀 👀`);await sleep(400);break;
    case 'start':msg(`${p.e} ${p.n} 回到起點`);await sleep(300);break;
  }
}
async function rollAnim(a,b){
  sfx('roll');
  const cs=[$('#d1'),$('#d2')];
  cs.forEach((c,i)=>{
    const [bx,by]=FACE_ROT[i?b:a];let [cx,cy]=cubeAng[i];
    cx=Math.ceil(cx/360)*360+720+bx+(i?360:0);cy=Math.ceil(cy/360)*360+1080+by+(i?0:360);
    cubeAng[i]=[cx,cy];
    const w=c.parentElement;w.classList.remove('toss');void w.offsetWidth;w.classList.add('toss');
    c.style.transition='transform .95s cubic-bezier(.2,.7,.25,1)';
    c.style.transform=`${TILT} rotateX(${cx}deg) rotateY(${cy}deg)`;
  });
  try{await sleep(1000);}finally{cs.forEach(c=>c.parentElement.classList.remove('toss'));}
}
function nextTurn(){
  if(over)return;
  let k=0;do{turn=(turn+1)%players.length;k++;}while(players[turn].bankrupt&&k<=players.length);
  busy=false;updateUI();
  msg(`輪到 ${cur().e} ${cur().n}`,true);
  $('#cmsg').textContent=`${cur().e} ${cur().n}，請擲骰子`;
}
async function takeTurn(){
  if(busy||over||!started)return;
  busy=true;ensureAudio();renderInfo();
  try{
    const p=cur();
    if(p.jail>0){
      p.jail--;msg(`⛓️ ${p.e} ${p.n} 在監獄中，本回合暫停`);renderPanel();await sleep(900);nextTurn();return;
    }
    const a=1+Math.random()*6|0,b=1+Math.random()*6|0;
    await rollAnim(a,b);lastRoll=a+b;
    msg(`${p.e} ${p.n} 擲出 ${a} + ${b} = ${a+b}`);
    await walk(p,a+b);
    await land(p,0);
    if(!over)nextTurn();
  }catch(e){if(e!==RESET)throw e;}
}

/* ========== 開局設定 ========== */
let setupCount=2;
function buildMoneyRows(){
  const box=$('#moneyRows'),old=[...box.querySelectorAll('input')].map(i=>i.value);
  box.innerHTML='';
  PLAYERS.forEach((pl,i)=>{
    const r=document.createElement('div');r.className='mrow';r.style.setProperty('--pc',pl.c);r.style.display=i<setupCount?'flex':'none';
    r.innerHTML=`<div class="av">${pl.e}</div><b style="min-width:54px">${pl.n}</b><input type="number" min="1000" step="500" inputmode="numeric" value="${old[i]||15000}">`;
    box.appendChild(r);
  });
}
function openSetup(canCancel){
  $('#cancelBtn').style.display=canCancel?'':'none';
  $('#setup').classList.add('show');
}
function startGame(){
  const inputs=[...$('#moneyRows').querySelectorAll('input')];
  const money=inputs.slice(0,setupCount).map(i=>{let v=parseInt(i.value,10);if(!(v>=1000))v=1000;i.value=v;return v;});
  gameId++;if(pending){const f=pending;pending=null;try{f();}catch(e){}}
  $('#dlg').classList.remove('show');$('#setup').classList.remove('show');
  players=money.map((m,i)=>({id:i,...PLAYERS[i],money:m,pos:0,jail:0,bankrupt:false,props:[]}));
  owner=Array(40).fill(null);turn=0;lastRoll=0;busy=false;over=false;started=true;
  $('#log').innerHTML='';setDice(1,1);
  msg(`🎮 遊戲開始！${players.map(p=>p.e).join(' ')} 起始資金 ${money.map(fmt).join(' / ')}`);
  $('#cmsg').textContent=`${cur().e} ${cur().n}，請擲骰子`;
  updateUI();
}

/* ========== 事件 ========== */
document.querySelectorAll('#cntSeg button').forEach(b=>b.onclick=()=>{
  setupCount=+b.dataset.n;document.querySelectorAll('#cntSeg button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('#moneyRows .mrow').forEach((r,i)=>r.style.display=i<setupCount?'flex':'none');
});
$('#startBtn').onclick=()=>{ensureAudio();startGame();};
$('#cancelBtn').onclick=()=>$('#setup').classList.remove('show');
$('#setupBtn').onclick=()=>openSetup(started);
$('#rollBtn').onclick=takeTurn;
$('#soundBtn').onclick=()=>{soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'🔊 音效：開':'🔇 音效：關';if(soundOn){ensureAudio();tone(880,.1,'sine',.15);}};
document.addEventListener('keydown',e=>{
  if((e.code==='Space'||e.code==='Enter')&&!$('#setup').classList.contains('show')&&!$('#dlg').classList.contains('show')&&document.activeElement.tagName!=='INPUT'){
    e.preventDefault();takeTurn();
  }
});

buildBoard();buildMoneyRows();buildCubes();setDice(1,1);
$('#tiltBtn').onclick=()=>{const on=$('#board').classList.toggle('tilt');$('#tiltBtn').textContent=on?'🎥 3D 視角：開':'🎥 3D 視角：關';};
$('#turnInfo').textContent='請先完成開局設定';$('#rollBtn').disabled=true;
})();
</script>
</body>
</html>
