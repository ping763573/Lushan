.dn{opacity:.6}.dn .nm{text-decoration:line-through}
.tr{margin:-4px 0 8px 14px;padding:2px 0 2px 12px;border-left:3px dashed var(--b);color:var(--b);font-size:16px}

.chip.on{background:var(--b);color:#fff}.chip small{font-size:14px}
.sum{position:sticky;top:0;z-index:5;padding:8px 14px}
.sumbar{all:unset;display:flex;justify-content:space-between;gap:8px;width:100%;min-height:44px;align-items:center;cursor:pointer;font-weight:500}
input[type=text],input[type=number],textarea{font:16px 'Noto Sans TC',sans-serif;min-height:44px;border:1.5px solid var(--b);border-radius:12px;padding:6px 10px;width:100%;color:var(--b)}
input[type=number]{width:120px}
.bar{height:14px;background:#dbe7e5;border-radius:99px;overflow:hidden;border:1.5px solid var(--b)}.bar i{display:block;height:100%;background:var(--g)}
.bp{display:flex;justify-content:space-between;gap:12px;margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--b)}
.bp>div{flex:1}
.x{border:0;background:none;color:var(--r);font-size:20px;min-width:44px;min-height:44px;cursor:pointer}
.hero svg{width:100%;height:auto;display:block;border-radius:12px}
.big{font-size:22px;font-weight:700;color:var(--b)}
.pn{display:none}.pn.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}60%{transform:translateY(-3px) scale(1.01)}to{opacity:1;transform:none}}
.card{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-12px)}}
@keyframes rip{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
.lan{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
.st{animation:steam 3s ease-in-out infinite}.st2{animation-delay:1.2s}
.wv{animation:rip 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.art{width:100%;height:auto;display:block;border-radius:10px;margin-bottom:8px;border:1.5px solid var(--b)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--y);outline-offset:2px}
</style>
</head>

function art(nm,k){let t=/太宰府|櫛田|神社|天滿宮/.test(nm)?'shrine':/福岡塔/.test(nm)?'tower':/柳川遊船/.test(nm)?'boat':/白秋|博物館|美術館/.test(nm)?'museum':/公園/.test(nm)?'park':/百道/.test(nm)?'beach':/屋台|中洲/.test(nm)?'yatai':/機場|空港|FUK|入境/.test(nm)?'plane':/飯店|退房/.test(nm)?'hotel':k=='f'||/拉麵|明太子|蒸籠|水炊/.test(nm)?'food':'shop';return SC[t]}
function tour(){const m=[];DAYS.forEach(d=>d.it.forEach(x=>{if(x[0]=='S')m.push(x)}));return `<div class="c"><h2>必去景點巡禮 ${X()}</h2>${m.map(x=>`<div style="margin-bottom:10px">${art(x[1],'S')}<b>${x[1]}</b></div>`).join('')}</div>`}
function card(it,id,n){const [k,nm,tm,dt,tr]=it;const dn=S.done[id];
 return (tr?`<div class="tr">▸ ${tr.split('｜').join('<br>')}</div>`:'')+`<div class="c card ${k.toLowerCase()} ${dn?'dn':''}" style="--i:${n}">${art(nm,k)}<div class="row"><span class="nm">${tm}　${nm}</span>${k=='S'?'<span class="tag">必去</span>':''}</div>${dt.split('｜').map(x=>`<div class="ln">${x}</div>`).join('')}<div class="row"><label class="ck"><input type="checkbox" data-a="done" data-id="${id}" ${dn?'checked':''}>已完成</label><a class="btn" target="_blank" rel="noopener" href="${mp(nm)}">地圖</a></div></div>`}
const yen=i=>+S.sp[i]||0;
function p1(){const d=DAYS[cur],r=S.rain[cur],w=d.wx;
 const list=(r?d.rain:d.it).map((x,j)=>card(x,(r?'r':'')+cur+'-'+j,j)).join('');
 $('#p1').innerHTML=`<div class="chips">${DAYS.map((x,k)=>`<button class="chip ${k==cur?'on':''}" data-a="day" data-k="${k}"><b>${x.d}</b><span>週${x.w}</span><small>第 ${k+1} 天</small></button>`).join('')}</div>
<div class="c sum"><button class="sumbar" data-a="sum"><span>${w[0]} ${w[2]}–${w[1]}°C・雨 ${w[3]}%</span><span>${HOTEL.n} ${S.sum?'▲':'▼'}</span></button>
${S.sum?`<div class="ln">穿搭：${w[4]} ${X()}<br>住宿：${HOTEL.addr}<br>鄰近：${HOTEL.st}（${HOTEL.walk}）<br><a class="btn" target="_blank" rel="noopener" href="${mp(HOTEL.n)}">Google 地圖</a></div>`:''}</div>
<h2>${d.t}</h2>
<label class="ck"><input type="checkbox" data-a="rain" ${r?'checked':''}>切換為雨天替代方案</label>
${list}
<div class="c"><b>今日花費</b><div class="row"><span>¥ <input type="number" inputmode="numeric" id="sp" data-a="sp" value="${S.sp[cur]||''}" placeholder="日圓"></span><b id="nt">≈ NT$ ${Math.round(yen(cur)*S.rate)}</b></div>
<label class="row">匯率（日圓→台幣）<input type="number" step="0.001" data-a="rate" value="${S.rate}"></label></div>${back}`}
function lst(key,title){const a=S[key],n=a.filter(x=>x.d).length;
 return `<div class="c"><h2>${title}</h2>${a.map((x,i)=>`<div class="row"><label class="ck nm"><input type="checkbox" data-a="lk" data-l="${key}" data-i="${i}" ${x.d?'checked':''}>${x.t}</label><button class="x" data-a="ld" data-l="${key}" data-i="${i}" aria-label="移除">✕</button></div>`).join('')}
<div class="row"><input type="text" id="n-${key}" placeholder="新增項目" style="flex:1"><button class="btn" data-a="la" data-l="${key}">新增</button></div></div>`}
function p2(){const a=S.todo.concat(S.bag),n=a.filter(x=>x.d).length,pc=a.length?Math.round(n/a.length*100):0;
 $('#p2').innerHTML=`<div class="c"><b>整體準備進度 ${n}／${a.length}（${pc}%）</b><div class="bar"><i style="width:${pc}%"></i></div></div>${lst('todo','行前待辦')}${lst('bag','行李準備')}${back}`}
function p3(){const tot=Object.values(S.sp).reduce((a,b)=>a+(+b||0),0);
 $('#p3').innerHTML=`<div class="c"><h2>${HOTEL.n} ${X()}</h2><div class="ln">地址：${HOTEL.addr}<br>最近車站：${HOTEL.st}（${HOTEL.walk}）<br>入住 ${HOTEL.ci}／退房 ${HOTEL.co}<br>訂房編號：${HOTEL.bk}</div><a class="btn" target="_blank" rel="noopener" href="${mp(HOTEL.n)}">Google 地圖</a></div>
<div class="c b"><h2>伴手禮與退稅</h2>${AREAS.map(a=>`<div><b>${a[0]}</b>：${a[1]}</div>`).join('')}<div class="ln" style="margin-top:8px">退稅：同店單日未稅滿 ¥5,000，需出示護照，詳細規定請以官方資訊為準。</div></div>
<div class="c"><h2>旅遊資訊速查</h2><div class="ln">警察：<a href="tel:110">110</a>｜消防・救護：<a href="tel:119">119</a><br>餐廳訂位編號：（尚未填寫）<br>保險資料：（尚未填寫）</div></div>
<div class="c"><h2>旅遊預算</h2>${DAYS.map((d,i)=>`<div class="row"><span>${d.d} ${d.t}</span><span>¥${yen(i).toLocaleString()}</span></div>`).join('')}<div class="bp"><div class="big">總計 ¥${tot.toLocaleString()}</div><div class="big">≈ NT$ ${Math.round(tot*S.rate).toLocaleString()}</div></div></div>
<div class="c"><h2>資料備份</h2><textarea id="bk" rows="3" placeholder="匯出後會顯示於此，或貼上備份後按匯入"></textarea><div class="row" style="margin-top:8px"><button class="btn" data-a="exp">匯出</button><button class="btn" data-a="imp">匯入</button></div></div>${back}`}
function draw(){nav();document.querySelectorAll('.pn').forEach((e,i)=>e.classList.toggle('on',i==tab));[p0,p1,p2,p3][tab]()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,k=+t.dataset.k;
 if(a=='tab'){tab=k;draw()}
 else if(a=='top'){$('#nav').scrollIntoView({behavior:'smooth'})}
 else if(a=='day'){cur=k;p1();document.querySelector('.chip.on').scrollIntoView({inline:'center',block:'nearest'})}
 else if(a=='sum'){S.sum=!S.sum;save();p1()}
 else if(a=='ld'){S[t.dataset.l].splice(+t.dataset.i,1);save();p2()}
 else if(a=='la'){const v=$('#n-'+t.dataset.l).value.trim();if(v){S[t.dataset.l].push({t:v,d:0});save();p2()}}
 else if(a=='exp'){$('#bk').value=JSON.stringify(S)}
 else if(a=='imp'){try{Object.assign(S,JSON.parse($('#bk').value));save();draw()}catch(x){alert('備份內容格式不正確')}}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a;if(!a)return;
 if(a=='done'){S.done[t.dataset.id]=t.checked;save();p1()}
 else if(a=='rain'){S.rain[cur]=t.checked;save();p1()}
 else if(a=='lk'){S[t.dataset.l][+t.dataset.i].d=t.checked?1:0;save();p2()}
 else if(a=='rate'){S.rate=+t.value||0.21;save();p1()}
 else if(a=='mode'){S.mode=t.value;save();p0()}});
document.addEventListener('input',e=>{if(e.target.dataset.a=='sp'){S.sp[cur]=e.target.value;save();$('#nt').textContent='≈ NT$ '+Math.round(yen(cur)*S.rate)}});
setInterval(()=>{if(tab==0)$('#st').innerHTML=status()},30000);
draw();
</script>
