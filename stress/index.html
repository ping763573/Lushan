    * {

    body {

    /* 螢幕震動動畫 */
    @keyframes screen-shake-mild {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-5px, 4px) rotate(-1deg); }
      40% { transform: translate(5px, -4px) rotate(1deg); }
      60% { transform: translate(-4px, -2px) rotate(0.5deg); }
      80% { transform: translate(4px, 2px) rotate(-0.5deg); }
    }
    @keyframes screen-shake-heavy {
      0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      10% { transform: translate(-14px, 10px) rotate(-3.5deg) scale(1.03); }
      30% { transform: translate(14px, -12px) rotate(3.5deg) scale(1.03); }
      50% { transform: translate(-15px, -9px) rotate(-2deg); }
      70% { transform: translate(12px, 12px) rotate(2.5deg); }
      90% { transform: translate(-8px, 8px) rotate(-1deg); }
    }
    .shake-mild {
      animation: screen-shake-mild 0.22s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    .shake-heavy {
      animation: screen-shake-heavy 0.38s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* 終極暴走脈衝光暈 */
    @keyframes ultra-rage-pulse {
      0%, 100% { box-shadow: inset 0 0 50px rgba(239, 68, 68, 0.85), 0 0 60px rgba(239, 68, 68, 0.7); }
      50% { box-shadow: inset 0 0 110px rgba(251, 146, 60, 1), 0 0 90px rgba(239, 68, 68, 0.95); }
    }
    .ultra-rage-active {
      animation: ultra-rage-pulse 0.25s infinite alternate;
    }

    /* 漫畫感大字報噴出動畫 */
    @keyframes comic-pop {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(-15deg); opacity: 0; }
      45% { transform: translate(-50%, -65%) scale(1.35) rotate(8deg); opacity: 1; }
      75% { transform: translate(-50%, -75%) scale(1.1) rotate(-4deg); opacity: 0.95; }
      100% { transform: translate(-50%, -95%) scale(0.85) rotate(5deg); opacity: 0; }
    }
    .comic-callout {
      position: absolute;
      left: 50%;
      top: 42%;
      pointer-events: none;
      animation: comic-pop 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 0 8px 16px rgba(0,0,0,0.7);
    }

    /* 衝擊波光圈 */
    @keyframes shockwave-grow {
      0% { transform: scale(0.6); opacity: 1; border-width: 8px; }
      100% { transform: scale(2.2); opacity: 0; border-width: 1px; }
    }
    .shockwave-ring {
      position: absolute;
      border-radius: 9999px;
      pointer-events: none;
      animation: shockwave-grow 0.45s ease-out forwards;
    }

    /* 3D 巨型鈴鐺核心 */
    .bell-3d-wrap {
      perspective: 900px;
    }
    .bell-btn {
      transition: transform 0.05s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.05s ease, filter 0.08s ease;
      transform-origin: center bottom;

    .bell-btn:active, .bell-btn.pressed {
      transform: translateY(22px) scale(1.24, 0.7) !important;
      filter: brightness(1.3) contrast(1.2);

      stroke-dashoffset: 600;

        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const rate = this.getPitchedRate();

        const dur = 0.85;
        const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < buf.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (buf.length * 0.4));
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buf;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1400 * rate, now);
        filter.frequency.exponentialRampToValueAtTime(35 * rate, now + dur);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(1.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + dur);

        const sub = ctx.createOscillator();
        const subGain = ctx.createGain();

        sub.frequency.exponentialRampToValueAtTime(20 * rate, now + 0.65);

        subGain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        sub.connect(subGain);

        const d = buf.getChannelData(0);
        for (let i = 0; i < buf.length; i++) d[i] = Math.random() * 2 - 1;

        const filter = ctx.createBiquadFilter();

        filter.frequency.linearRampToValueAtTime(250 * rate, now + dur);

        gain.gain.exponentialRampToValueAtTime(0.01, now + dur);

        noise.connect(filter);

        gain.connect(ctx.destination);

      playWind() {
        if (isMuted) return;
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const rate = this.getPitchedRate();

        const bufferSize = ctx.sampleRate * 0.6;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(400 * rate, now);
        filter.frequency.linearRampToValueAtTime(650 * rate, now + 0.3);
        filter.frequency.linearRampToValueAtTime(300 * rate, now + 0.6);
        filter.Q.value = 5.0;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0.35, now + 0.25);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(now);
        noise.stop(now + 0.6);

       3. 物理重力反彈 Emoji 粒子系統 (Canvas)
       ============================================================ */
    const canvas = document.getElementById('particle-canvas');
    const cCtx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class PhysicsEmoji {
      constructor(x, y, emoji, isUltra = false) {
        this.x = x;
        this.y = y;
        this.emoji = emoji;
        const speed = isUltra ? (14 + Math.random() * 18) : (8 + Math.random() * 12);
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.8;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.gravity = 0.55;
        this.bounce = -0.45;
        this.floor = canvas.height - 30;
        this.size = isUltra ? (36 + Math.random() * 22) : (26 + Math.random() * 14);
        this.rot = Math.random() * 360;
        this.rotSpeed = (Math.random() - 0.5) * 16;
        this.alpha = 1.0;
        this.decay = 0.012 + Math.random() * 0.01;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rot += this.rotSpeed;

        if (this.y >= this.floor) {
          this.y = this.floor;
          this.vy *= this.bounce;
          this.vx *= 0.8;
        }

        this.alpha -= this.decay;
      }

      draw(context) {
        context.save();
        context.globalAlpha = Math.max(0, this.alpha);
        context.translate(this.x, this.y);
        context.rotate((this.rot * Math.PI) / 180);
        context.font = `${this.size}px 'Noto Color Emoji', sans-serif`;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(this.emoji, 0, 0);
        context.restore();
      }
    }

    function spawnCannonEmojis(x, y, emojiList, isUltra = false) {
      const count = isUltra ? 26 : 14;
      for (let i = 0; i < count; i++) {
        const em = emojiList[Math.floor(Math.random() * emojiList.length)];
        particles.push(new PhysicsEmoji(x + (Math.random() - 0.5) * 40, y, em, isUltra));
      }
    }

    function particleLoop() {
      cCtx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(cCtx);
        if (p.alpha <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(particleLoop);
    }
    particleLoop();

          tab.style.borderColor = currentMood.accentColor;
        } else {
          tab.className = 'flex-shrink-0 px-3.5 py-1.5 rounded-full border transition-all active:scale-95 flex items-center gap-1.5 whitespace-nowrap bg-slate-900 border-slate-800 text-slate-400';
          tab.style.borderColor = '';
        }
      });
    }

    function renderSoundMatrix() {
      soundMatrixGrid.innerHTML = '';
      currentMood.sounds.forEach((snd) => {
        const isSelected = snd.id === selectedSound.id;
        const btn = document.createElement('button');
        btn.className = `flex flex-col items-center justify-center p-1.5 rounded-xl text-center border transition-all active:scale-90 ${
          isSelected 
            ? 'bg-slate-800 border-white text-white font-black shadow ring-2 ring-white/40' 
            : 'bg-slate-950 hover:bg-slate-850 border-slate-800 text-slate-400 font-semibold'
        }`;
        btn.innerHTML = `
          <span class="text-xl mb-0.5">${snd.icon}</span>
          <span class="text-[9px] truncate w-full leading-tight">${snd.name}</span>
        `;
        btn.onclick = (e) => {
          e.stopPropagation();
          selectedSound = snd;
          bellCoreIcon.textContent = snd.icon;
          bellCoreName.textContent = snd.name;
          renderSoundMatrix();
          executeSmash(false);
        };
        soundMatrixGrid.appendChild(btn);
      });
    }

    /* ============================================================
       7. 操作手感與進階功能綁定
       ============================================================ */
    smashBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isPointerHolding = true;
      executeSmash(false);

      autoMachineGunTimer = setTimeout(() => {
        if (isPointerHolding) {
          actionHint.textContent = '⚡ 機關槍連射啟動！不要放手！';
          const intervalId = setInterval(() => {
            if (!isPointerHolding) {
              clearInterval(intervalId);
              actionHint.textContent = '按一下解氣，按住不放瘋狂機關槍！';
              return;
            }
            executeSmash(true);
          }, 110);
        }
      }, 280);
    });

    const stopHolding = () => {
      isPointerHolding = false;
      clearTimeout(autoMachineGunTimer);
    };
    window.addEventListener('pointerup', stopHolding);
    window.addEventListener('pointercancel', stopHolding);

    window.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
        executeSmash(false);
      }
    });

    const pitchSlider = document.getElementById('pitch-slider');
    const pitchValTxt = document.getElementById('pitch-value-txt');
    pitchSlider.addEventListener('input', (e) => {
      globalPitchMultiplier = parseFloat(e.target.value);
      pitchValTxt.textContent = `${globalPitchMultiplier.toFixed(2)}x`;
    });

    const toggleMuteBtn = document.getElementById('toggle-mute');
    toggleMuteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      toggleMuteBtn.textContent = isMuted ? '🔇' : '🔊';
      toggleMuteBtn.classList.toggle('bg-rose-900', isMuted);
    });

    const toggleHapticBtn = document.getElementById('toggle-haptic');
    toggleHapticBtn.addEventListener('click', () => {
      isHapticEnabled = !isHapticEnabled;
      toggleHapticBtn.textContent = isHapticEnabled ? '📳' : '🔕';
      toggleHapticBtn.classList.toggle('opacity-50', !isHapticEnabled);
    });

    const toggleRandomBtn = document.getElementById('toggle-random');
    const randomTxt = document.getElementById('random-txt');
    toggleRandomBtn.addEventListener('click', () => {
      isRandomBox = !isRandomBox;
      randomTxt.textContent = `盲盒: ${isRandomBox ? '開 🎉' : '關'}`;
      toggleRandomBtn.classList.toggle('border-rose-400', isRandomBox);
      toggleRandomBtn.classList.toggle('text-rose-400', isRandomBox);
    });

    const toggleAutoClickBtn = document.getElementById('toggle-autoclick');
    const autoclickTxt = document.getElementById('autoclick-txt');
    toggleAutoClickBtn.addEventListener('click', () => {
      if (autoClickInterval) {
        clearInterval(autoClickInterval);
        autoClickInterval = null;
        autoclickTxt.textContent = '自動狂按: 關';
        toggleAutoClickBtn.classList.remove('bg-rose-600', 'text-white');
      } else {
        autoclickTxt.textContent = '狂暴掃射中 🔥';
        toggleAutoClickBtn.classList.add('bg-rose-600', 'text-white');
        autoClickInterval = setInterval(() => {
          executeSmash(true);
        }, 130);
      }
    });

    // 終極核爆
    btnNuke.addEventListener('click', () => {
      AudioEngine.playExplosion();
      AudioEngine.playChickenScream();
      AudioEngine.speakText('終極核爆！通通毀滅吧！');
      triggerDramaticFX('heavy');
      const rect = smashBtn.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      spawnCannonEmojis(rect.left + rect.width / 2 - canvasRect.left, rect.top + rect.height / 2 - canvasRect.top, ['☢️', '💥', '🔥', '💣', '🤯'], true);
      spawnCannonEmojis(rect.left + rect.width / 2 - canvasRect.left, rect.top + rect.height / 2 - canvasRect.top, ['🎉', '✨', '⚡', '🥳'], true);
      rageScore = 0;
      rageProgress.style.width = '0%';
      rageLabel.textContent = '壓力已徹底歸零 🕊️';
      btnNuke.classList.add('hidden');
    });

    // 自訂出氣筒 Modal 邏輯
    const targetModal = document.getElementById('target-modal');
    const btnCustomTarget = document.getElementById('btn-custom-target');
    const btnSaveTarget = document.getElementById('btn-save-target');
    const btnClearTarget = document.getElementById('btn-clear-target');
    const inputTargetName = document.getElementById('input-target-name');
    const targetBadge = document.getElementById('target-badge');
    const targetNameSpan = document.getElementById('target-name');

    btnCustomTarget.addEventListener('click', () => {
      targetModal.classList.remove('hidden');
      inputTargetName.focus();
    });

    btnSaveTarget.addEventListener('click', () => {
      const val = inputTargetName.value.trim();
      if (val) {
        customTargetName = val;
        targetNameSpan.textContent = val;
        targetBadge.classList.remove('hidden');
      }
      targetModal.classList.add('hidden');
    });

    btnClearTarget.addEventListener('click', () => {
      customTargetName = '';
      inputTargetName.value = '';
      targetBadge.classList.add('hidden');
      targetModal.classList.add('hidden');
    });

    targetModal.addEventListener('click', (e) => {
      if (e.target === targetModal) targetModal.classList.add('hidden');
    });

    // 初始化啟動
    initMoodTabs();
    applyMoodTheme('rage');
  </script>
</body>
</html>
